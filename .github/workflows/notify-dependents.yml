name: Notify Dependents

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: notify-dependents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Determine mode and targets
        id: plan
        run: |
          set -euo pipefail
          # --- configure per package repo --------------------------------------
          # PRODUCTION_TARGETS: every repo that depends on this package (master).
          # TEST_TARGETS:       the test server repo(s) for pre-merge testing.
          PRODUCTION_TARGETS="RBClauneck/server-test"
          TEST_TARGETS="RBClauneck/server-test"
          # ---------------------------------------------------------------------
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "mode=production"             >> "$GITHUB_OUTPUT"
            echo "targets=$PRODUCTION_TARGETS" >> "$GITHUB_OUTPUT"
          else
            echo "mode=testing"                >> "$GITHUB_OUTPUT"
            echo "targets=$TEST_TARGETS"        >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch submodule update to dependents
        env:
          GH_TOKEN:       ${{ secrets.DISPATCH_TOKEN }}
          MODE:           ${{ steps.plan.outputs.mode }}
          TARGETS:        ${{ steps.plan.outputs.targets }}
          PACKAGE:        ${{ github.event.repository.name }}
          SUBMODULE_PATH: packages/economy
          SOURCE_BRANCH:  ${{ github.ref_name }}
          SOURCE_SHA:     ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DISPATCH_TOKEN is not configured - skipping dispatch."
            echo "Add a PAT (Contents: read/write on the dependent repos) as the"
            echo "DISPATCH_TOKEN secret to enable cross-repository submodule updates."
            exit 0
          fi
          for repo in $TARGETS; do
            echo "-> $repo ($MODE): $PACKAGE @ ${SOURCE_SHA:0:7} from $SOURCE_BRANCH"
            jq -n \
              --arg mode   "$MODE" \
              --arg pkg    "$PACKAGE" \
              --arg path   "$SUBMODULE_PATH" \
              --arg branch "$SOURCE_BRANCH" \
              --arg sha    "$SOURCE_SHA" \
              '{event_type:"update_submodule",
                client_payload:{mode:$mode, package:$pkg, submodule_path:$path,
                                source_branch:$branch, source_sha:$sha}}' \
            | gh api --method POST "repos/$repo/dispatches" --input -
          done
